name: build-adreno-metal-13
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: macos-13
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: toolchain
        run: |
          brew install glslang spirv-tools meson ninja || true
          which glslc spirv-val meson ninja cargo || true
      - name: turnip
        run: python3 scripts/build-turnip-darwin.py --target ios
      - name: plugin
        run: python3 scripts/build-adreno-metal-plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: adreno-metal
          if-no-files-found: error
          path: |
            build/adreno-metal-plugin/NativeAdrenoMetal.bundle
            build/mesa-tu-ios/src/freedreno/vulkan/libvulkan_freedreno.dylib
            build/prime-list.txt
